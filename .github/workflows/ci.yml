name: evidence-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: evidence-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Evidence validation
        run: python scripts/validate.py
      - name: OPSEC scan
        run: python scripts/opsec_scan.py
      - name: Static-site checks
        run: python scripts/test_site.py
      - name: Contrast regression
        run: python scripts/test_contrast.py
      - name: Branding and release-target invariants
        run: python scripts/test_branding.py
      - name: Guided-reading page checks
        run: python scripts/test_explore.py
      - name: JavaScript syntax
        run: node --check web/app.js && node --check web/explore.js
      - name: JavaScript tests
        run: node --test tests/*.test.mjs
      - name: Deployment artifact test
        run: python scripts/test_deploy.py
