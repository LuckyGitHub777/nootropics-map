name: release

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Release gate approval'
        required: true
        type: choice
        options:
          - DO_NOT_RELEASE
          - RELEASE
      tag_name:
        description: 'Semantic version tag, for example v0.2.0'
        required: true
        type: string
      target_sha:
        description: 'Full 40-character commit SHA already contained in main'
        required: true
        type: string
      release_title:
        description: 'Release title'
        required: true
        type: string
      release_notes:
        description: 'Release notes (Markdown)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag_name }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.confirm_release == 'RELEASE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag_name }}
      TARGET_SHA: ${{ inputs.target_sha }}
      RELEASE_TITLE: ${{ inputs.release_title }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      ACTOR_ID: ${{ github.actor_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify repository and actor
        run: |
          [ "$REPO" = "LuckyGitHub777/nootropics-map" ] || { echo "::error::Unexpected repository."; exit 1; }
          [ "$ACTOR" = "LuckyGitHub777" ] || { echo "::error::Unexpected release actor."; exit 1; }

      - name: Validate inputs
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag_name must look like v1.2.3."; exit 1; }
          [[ "$TARGET_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo "::error::target_sha must be a full 40-character SHA."; exit 1; }
          [ -n "$RELEASE_TITLE" ] && [ -n "$RELEASE_NOTES" ] || { echo "::error::Title and notes are required."; exit 1; }

      - name: Reject tool attribution in release metadata
        run: |
          python3 - <<'PY'
          import hashlib, os, re, sys
          # Denied terms are stored only as SHA-256 hashes of their lowercase alphanumeric form.
          DENIED = {
              "c857d09db23e6822e3600bc06ad8d58f92ed62bc8efd81c753f77048662cb97d",
              "c70eca6b0f88f44d81a41311647e50fda1ac454ec04ffd442b0eb4743a993131",
              "60965168ce762e949600281ba6d01fee136e5b6e8257b1f216f9025ed324474c",
              "7d3194f79e645c42e4396dda38be04766810ec6a00d00aced3ffc2a0a1f1a9ef",
              "e7d6267688cf5aae4dc412bbaa88aa8bcdc98792f8b6c3e6fb06a4cf0aa58718",
          }
          text = re.sub(r"[^a-z0-9]", "", (os.environ["RELEASE_TITLE"] + os.environ["RELEASE_NOTES"]).lower())
          for size in (6, 7, 9, 11):
              for i in range(len(text) - size + 1):
                  if hashlib.sha256(text[i:i + size].encode()).hexdigest() in DENIED:
                      print("::error::Release metadata contains disallowed attribution.")
                      sys.exit(1)
          print("Release metadata is clean.")
          PY

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Verify target commit is in main
        run: |
          git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
          git cat-file -e "${TARGET_SHA}^{commit}" || { echo "::error::Target is not a commit."; exit 1; }
          FULL_SHA="$(git rev-parse "${TARGET_SHA}^{commit}")"
          git merge-base --is-ancestor "$FULL_SHA" origin/main || { echo "::error::Target is not contained in main."; exit 1; }
          echo "FULL_SHA=$FULL_SHA" >> "$GITHUB_ENV"

      - name: Create or verify annotated tag
        run: |
          check_tag() {
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            [ "$(git cat-file -t "refs/tags/$TAG")" = "tag" ] || { echo "::error::$TAG exists but is not an annotated tag."; exit 1; }
            [ "$(git rev-parse "$TAG^{commit}")" = "$FULL_SHA" ] || { echo "::error::$TAG points to a different commit."; exit 1; }
          }
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "Tag already exists; verifying without changes."
            check_tag
          else
            git config user.name "$ACTOR"
            git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"
            git tag -a "$TAG" "$FULL_SHA" -m "$RELEASE_TITLE"
            git push origin "refs/tags/$TAG"
            git tag -d "$TAG" > /dev/null
            check_tag
          fi
          echo "TAG_OBJECT=$(git rev-parse "refs/tags/$TAG")" >> "$GITHUB_ENV"

      - name: Create or verify release
        run: |
          printf '%s\n' "$RELEASE_NOTES" > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "Release already exists; verifying without changes."
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag --title "$RELEASE_TITLE" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Verify release and print receipt
        run: |
          gh api "repos/$REPO/releases/tags/$TAG" > "$RUNNER_TEMP/release.json"
          python3 - "$RUNNER_TEMP/release.json" <<'PY'
          import hashlib, json, os, re, sys
          DENIED = {
              "c857d09db23e6822e3600bc06ad8d58f92ed62bc8efd81c753f77048662cb97d",
              "c70eca6b0f88f44d81a41311647e50fda1ac454ec04ffd442b0eb4743a993131",
              "60965168ce762e949600281ba6d01fee136e5b6e8257b1f216f9025ed324474c",
              "7d3194f79e645c42e4396dda38be04766810ec6a00d00aced3ffc2a0a1f1a9ef",
              "e7d6267688cf5aae4dc412bbaa88aa8bcdc98792f8b6c3e6fb06a4cf0aa58718",
          }
          release = json.load(open(sys.argv[1], encoding="utf-8"))
          problems = []
          if release.get("tag_name") != os.environ["TAG"]: problems.append("tag mismatch")
          if release.get("name") != os.environ["RELEASE_TITLE"]: problems.append("title mismatch")
          if release.get("draft"): problems.append("release is a draft")
          if release.get("prerelease"): problems.append("release is a prerelease")
          text = re.sub(r"[^a-z0-9]", "", ((release.get("name") or "") + (release.get("body") or "")).lower())
          if any(hashlib.sha256(text[i:i + n].encode()).hexdigest() in DENIED for n in (6, 7, 9, 11) for i in range(len(text) - n + 1)):
              problems.append("release metadata contains disallowed attribution")
          print("RELEASE RECEIPT")
          print(f"repository:      {os.environ['REPO']}")
          print(f"actor:           {os.environ['ACTOR']}")
          print(f"tag:             {os.environ['TAG']} (object type: tag)")
          print(f"tag object:      {os.environ['TAG_OBJECT']}")
          print(f"target commit:   {os.environ['FULL_SHA']}")
          print(f"release:         {release.get('html_url')}")
          print("result:          " + ("PASS" if not problems else "FAIL — " + "; ".join(problems)))
          sys.exit(1 if problems else 0)
          PY
